<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Golden Tree — 재고 입력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17161f;
    --canvas: #ffffff;
    --surface-soft: #f7f7f5;
    --hairline: #e6e6e6;
    --hairline-soft: #f1f1f1;
    --stone: #6b6b6b;
    --muted: #9a9a9a;
    --positive-bg: #dceeb1;
    --positive-text: #1a6b34;
    --negative-bg: #f3c9b6;
    --negative-text: #a13d24;
    --warn-bg: #f4ecd6;
    --warn-text: #8a6d1a;
    --accent: #c5b0f4;
    --radius-card: 20px;
    --radius-md: 12px;
    --radius-pill: 50px;
    --shadow-card: 0 1px 2px -1px rgba(0,0,0,.08), 0 4px 16px -4px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-soft);
    color: var(--ink);
    font-family: Inter, "SF Pro Display", system-ui, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--canvas) 90%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline-soft);
    padding: 14px 16px;
  }
  .brand { font-size: 13px; font-weight: 600; }
  .brand .dim { color: var(--muted); font-weight: 500; }
  main { padding: 16px; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  #gate { max-width: 320px; margin: 80px auto; padding: 24px; background: var(--canvas); border-radius: var(--radius-card); box-shadow: var(--shadow-card); text-align: center; }
  #gate input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--hairline); border-radius: var(--radius-md); margin: 12px 0; font-family: inherit; }
  #gate button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; background: var(--ink); color: var(--canvas); border: none; border-radius: var(--radius-pill); cursor: pointer; }
  #gateError { color: var(--negative-text); font-size: 13px; min-height: 18px; }

  .searchBar { position: sticky; top: 53px; z-index: 9; background: var(--surface-soft); padding: 4px 0 8px; }
  .searchBar input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid var(--hairline); border-radius: var(--radius-pill); font-family: inherit; background: var(--canvas); }

  .item-card { background: var(--canvas); border: 1px solid var(--hairline-soft); box-shadow: var(--shadow-card); border-radius: var(--radius-card); padding: 16px; }
  .item-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .item-name { font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em; }
  .badge { flex-shrink: 0; font-size: 11.5px; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-pill); white-space: nowrap; }
  .badge.충분 { background: var(--positive-bg); color: var(--positive-text); }
  .badge.보통 { background: var(--surface-soft); color: var(--stone); }
  .badge.조금여유 { background: var(--warn-bg); color: var(--warn-text); }
  .badge.거의없음, .badge.없음 { background: var(--negative-bg); color: var(--negative-text); }
  .badge.기록없음, .badge.알수없음 { background: var(--hairline-soft); color: var(--muted); }

  .item-est { font-size: 12.5px; color: var(--stone); margin-top: 4px; }
  .item-controls { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .ctrl-row { display: flex; gap: 6px; align-items: center; }
  .ctrl-row label { font-size: 11px; color: var(--muted); width: 62px; flex-shrink: 0; }
  .ctrl-row input { flex: 1; min-width: 0; padding: 8px 10px; font-size: 14px; border: 1px solid var(--hairline); border-radius: var(--radius-md); font-family: inherit; }
  .ctrl-row button { flex-shrink: 0; padding: 8px 12px; font-size: 12.5px; font-weight: 600; border: none; border-radius: var(--radius-md); cursor: pointer; background: var(--ink); color: var(--canvas); }
  .ctrl-row.units button { background: var(--surface-soft); color: var(--ink); border: 1px solid var(--hairline); }
  .ctrl-row.count button { background: var(--ink); }
  .ctrl-row.production button { background: var(--positive-text); }
  .toast { font-size: 11.5px; color: var(--stone); min-height: 14px; margin-top: 4px; }

  .loading, .error { text-align: center; color: var(--stone); padding: 60px 16px; font-size: 14px; }
  .error { color: var(--negative-text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate">
  <div class="brand">82 Bakeshop <span class="dim">· 재고 입력</span></div>
  <input id="passcodeInput" type="password" placeholder="비밀번호" autocomplete="off" />
  <button id="gateSubmit">입장</button>
  <div id="gateError"></div>
</div>

<div id="app" hidden>
  <header><div class="brand">82 Bakeshop <span class="dim">· 재고 입력</span></div></header>
  <main>
    <div class="searchBar"><input id="search" placeholder="품목 검색 (예: 마카롱, 쿠키)" /></div>
    <div id="content" class="loading">불러오는 중...</div>
  </main>
</div>

<script>
const API = 'https://stfiazhmznssyfsiaxvw.supabase.co/functions/v1/stock-entry-api';
let passcode = '';
let allItems = [];

function fmtNum(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString('en-CA', { maximumFractionDigits: 2 });
}

async function apiCall(method, body) {
  const res = await fetch(API + (method === 'GET' ? '' : ''), {
    method,
    headers: { 'Content-Type': 'application/json', 'x-stock-passcode': passcode },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) throw new Error('UNAUTHORIZED');
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function renderItem(item) {
  const unit = item.container_label || '통';
  const est = item.last_count_at
    ? `현재 추정: ${fmtNum(item.estimated_containers)}${unit}(${fmtNum(item.estimated_units)}개)` + (item.days_left !== null ? ` · 약 ${fmtNum(item.days_left)}일분` : '')
    : '아직 카운트 기록 없음';
  return '<div class="item-card" data-id="' + item.stock_item_id + '">' +
    '<div class="item-head">' +
      '<div class="item-name">' + item.name + '</div>' +
      '<div class="badge ' + item.status + '">' + item.status + '</div>' +
    '</div>' +
    '<div class="item-est">' + est + '</div>' +
    '<div class="item-controls">' +
      '<div class="ctrl-row units">' +
        '<label>통당개수</label>' +
        '<input type="number" step="0.01" class="unitsInput" value="' + item.units_per_container + '" />' +
        '<button class="saveUnitsBtn">저장</button>' +
      '</div>' +
      '<div class="ctrl-row count">' +
        '<label>지금 ' + unit + '수</label>' +
        '<input type="number" step="0.1" class="countInput" placeholder="예: 1.5" />' +
        '<button class="countBtn">카운트</button>' +
      '</div>' +
      '<div class="ctrl-row production">' +
        '<label>만든 ' + unit + '수</label>' +
        '<input type="number" step="0.1" class="productionInput" placeholder="예: 2" />' +
        '<button class="productionBtn">생산 추가</button>' +
      '</div>' +
      '<div class="toast"></div>' +
    '</div>' +
  '</div>';
}

function attachHandlers(container) {
  container.querySelectorAll('.item-card').forEach((card) => {
    const id = Number(card.dataset.id);
    const toast = card.querySelector('.toast');
    const setToast = (msg, isErr) => { toast.textContent = msg; toast.style.color = isErr ? 'var(--negative-text)' : 'var(--stone)'; };

    card.querySelector('.saveUnitsBtn').addEventListener('click', async () => {
      const v = parseFloat(card.querySelector('.unitsInput').value);
      if (!v || v <= 0) return setToast('통당개수를 올바르게 입력하세요', true);
      try {
        await apiCall('POST', { action: 'set_units', stock_item_id: id, units_per_container: v });
        setToast('저장됨');
        load();
      } catch (e) { setToast('실패: ' + e.message, true); }
    });

    card.querySelector('.countBtn').addEventListener('click', async () => {
      const input = card.querySelector('.countInput');
      const v = parseFloat(input.value);
      if (isNaN(v) || v < 0) return setToast('통 수를 입력하세요', true);
      try {
        await apiCall('POST', { action: 'event', stock_item_id: id, event_type: 'count', container_count: v });
        setToast('카운트 기록됨');
        input.value = '';
        load();
      } catch (e) { setToast('실패: ' + e.message, true); }
    });

    card.querySelector('.productionBtn').addEventListener('click', async () => {
      const input = card.querySelector('.productionInput');
      const v = parseFloat(input.value);
      if (isNaN(v) || v <= 0) return setToast('만든 통 수를 입력하세요', true);
      try {
        await apiCall('POST', { action: 'event', stock_item_id: id, event_type: 'production', container_count: v });
        setToast('생산 추가됨');
        input.value = '';
        load();
      } catch (e) { setToast('실패: ' + e.message, true); }
    });
  });
}

function renderList(filter) {
  const content = document.getElementById('content');
  const items = filter
    ? allItems.filter((i) => i.name.toLowerCase().includes(filter.toLowerCase()))
    : allItems;
  if (items.length === 0) {
    content.innerHTML = '<div class="error">검색 결과가 없습니다</div>';
    return;
  }
  content.innerHTML = items.map(renderItem).join('');
  attachHandlers(content);
}

async function load() {
  const content = document.getElementById('content');
  try {
    const data = await apiCall('GET');
    allItems = data.items || [];
    renderList(document.getElementById('search').value);
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') {
      localStorage.removeItem('stock_passcode');
      document.getElementById('app').hidden = true;
      document.getElementById('gate').hidden = false;
      document.getElementById('gateError').textContent = '비밀번호가 틀렸습니다';
      return;
    }
    content.className = 'error';
    content.textContent = '불러오지 못했습니다: ' + e.message;
  }
}

document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));

async function tryEnter(code) {
  passcode = code;
  document.getElementById('gateError').textContent = '';
  try {
    await apiCall('GET');
    localStorage.setItem('stock_passcode', code);
    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;
    load();
  } catch (e) {
    document.getElementById('gateError').textContent = '비밀번호가 틀렸습니다';
  }
}

document.getElementById('gateSubmit').addEventListener('click', () => {
  tryEnter(document.getElementById('passcodeInput').value);
});
document.getElementById('passcodeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryEnter(document.getElementById('passcodeInput').value);
});

const saved = localStorage.getItem('stock_passcode');
if (saved) tryEnter(saved);
</script>
</body>
</html>
