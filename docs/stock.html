<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Golden Tree — 재고 입력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17161f;
    --canvas: #ffffff;
    --surface-soft: #f7f7f5;
    --hairline: #e6e6e6;
    --hairline-soft: #f1f1f1;
    --stone: #6b6b6b;
    --muted: #9a9a9a;
    --positive-bg: #dceeb1;
    --positive-text: #1a6b34;
    --negative-bg: #f3c9b6;
    --negative-text: #a13d24;
    --warn-bg: #f4ecd6;
    --warn-text: #8a6d1a;
    --accent: #c5b0f4;
    --radius-card: 20px;
    --radius-md: 12px;
    --radius-pill: 50px;
    --shadow-card: 0 1px 2px -1px rgba(0,0,0,.08), 0 4px 16px -4px rgba(0,0,0,.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-soft);
    color: var(--ink);
    font-family: Inter, "SF Pro Display", system-ui, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--canvas) 90%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline-soft);
    padding: 14px 16px;
  }
  .brand { font-size: 13px; font-weight: 600; }
  .brand .dim { color: var(--muted); font-weight: 500; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }

  #gate { max-width: 320px; margin: 80px auto; padding: 24px; background: var(--canvas); border-radius: var(--radius-card); box-shadow: var(--shadow-card); text-align: center; }
  #gate input { width: 100%; padding: 12px 14px; font-size: 16px; border: 1px solid var(--hairline); border-radius: var(--radius-md); margin: 12px 0; font-family: inherit; }
  #gate button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; background: var(--ink); color: var(--canvas); border: none; border-radius: var(--radius-pill); cursor: pointer; }
  #gateError { color: var(--negative-text); font-size: 13px; min-height: 18px; }

  .searchBar { position: sticky; top: 53px; z-index: 9; background: var(--surface-soft); padding: 4px 0 8px; }
  .searchBar input { width: 100%; padding: 11px 14px; font-size: 15px; border: 1px solid var(--hairline); border-radius: var(--radius-pill); font-family: inherit; background: var(--canvas); }

  /* 표 형태 — 한눈에 보기 위함(오너 요청). 이름 열은 가로 스크롤 중에도 고정해서 어느
     품목인지 항상 보이게 한다(모바일 좁은 화면에서도 표가 그대로 쓸모 있게). */
  .tableWrap { background: var(--canvas); border: 1px solid var(--hairline-soft); box-shadow: var(--shadow-card); border-radius: var(--radius-card); overflow-x: auto; }
  table.stock { border-collapse: collapse; width: 100%; font-size: 12.5px; white-space: nowrap; }
  table.stock th, table.stock td { padding: 8px 10px; border-bottom: 1px solid var(--hairline-soft); text-align: left; }
  table.stock th { position: sticky; top: 0; background: var(--canvas); font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; z-index: 2; }
  table.stock td.nameCell, table.stock th.nameCell {
    position: sticky; left: 0; background: var(--canvas); z-index: 1;
    white-space: normal; min-width: 150px; max-width: 190px; font-weight: 600; font-size: 12.5px;
    box-shadow: 1px 0 0 var(--hairline-soft);
  }
  table.stock th.nameCell { z-index: 3; }
  table.stock tr:last-child td { border-bottom: none; }
  table.stock .estCell { color: var(--stone); font-size: 12px; }
  table.stock input { width: 56px; padding: 6px 7px; font-size: 12.5px; border: 1px solid var(--hairline); border-radius: 8px; font-family: inherit; }
  table.stock button { padding: 6px 9px; font-size: 11.5px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; background: var(--ink); color: var(--canvas); margin-left: 4px; }
  table.stock button.unitsBtn { background: var(--surface-soft); color: var(--ink); border: 1px solid var(--hairline); }
  table.stock button.productionBtn { background: var(--positive-text); }
  .cellGroup { display: flex; align-items: center; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 9px; border-radius: var(--radius-pill); white-space: nowrap; }
  .badge.충분 { background: var(--positive-bg); color: var(--positive-text); }
  .badge.보통 { background: var(--surface-soft); color: var(--stone); }
  .badge.조금여유 { background: var(--warn-bg); color: var(--warn-text); }
  .badge.거의없음, .badge.없음 { background: var(--negative-bg); color: var(--negative-text); }
  .badge.기록없음, .badge.알수없음 { background: var(--hairline-soft); color: var(--muted); }
  .toast { font-size: 10.5px; color: var(--stone); white-space: nowrap; }

  .loading, .error { text-align: center; color: var(--stone); padding: 60px 16px; font-size: 14px; }
  .error { color: var(--negative-text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="gate">
  <div class="brand">82 Bakeshop <span class="dim">· 재고 입력</span></div>
  <input id="passcodeInput" type="password" placeholder="비밀번호" autocomplete="off" />
  <button id="gateSubmit">입장</button>
  <div id="gateError"></div>
</div>

<div id="app" hidden>
  <header><div class="brand">82 Bakeshop <span class="dim">· 재고 입력</span></div></header>
  <main>
    <div class="searchBar"><input id="search" placeholder="품목 검색 (예: 마카롱, 쿠키)" /></div>
    <div id="content" class="loading">불러오는 중...</div>
  </main>
</div>

<script>
const API = 'https://stfiazhmznssyfsiaxvw.supabase.co/functions/v1/stock-entry-api';
let passcode = '';
let allItems = [];

function fmtNum(n) {
  if (n === null || n === undefined) return '-';
  return Number(n).toLocaleString('en-CA', { maximumFractionDigits: 2 });
}

async function apiCall(method, body) {
  const res = await fetch(API + (method === 'GET' ? '' : ''), {
    method,
    headers: { 'Content-Type': 'application/json', 'x-stock-passcode': passcode },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) throw new Error('UNAUTHORIZED');
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function renderRow(item) {
  const unit = item.container_label || '통';
  const est = item.last_count_at
    ? `${fmtNum(item.estimated_containers)}${unit} (${fmtNum(item.estimated_units)}개)`
    : '기록없음';
  const days = item.days_left !== null && item.days_left !== undefined ? fmtNum(item.days_left) + '일' : '-';
  return '<tr data-id="' + item.stock_item_id + '">' +
    '<td class="nameCell">' + item.name + '</td>' +
    '<td><span class="badge ' + item.status + '">' + item.status + '</span></td>' +
    '<td class="estCell">' + est + '</td>' +
    '<td class="estCell">' + days + '</td>' +
    '<td><div class="cellGroup"><input type="number" step="0.01" class="unitsInput" value="' + item.units_per_container + '" /><button class="unitsBtn saveUnitsBtn">저장</button></div></td>' +
    '<td><div class="cellGroup"><input type="number" step="0.1" class="countInput" placeholder="' + unit + '수" /><button class="countBtn">카운트</button></div></td>' +
    '<td><div class="cellGroup"><input type="number" step="0.1" class="productionInput" placeholder="' + unit + '수" /><button class="productionBtn">생산</button></div></td>' +
    '<td class="toast"></td>' +
  '</tr>';
}

function attachHandlers(container) {
  container.querySelectorAll('tr[data-id]').forEach((row) => {
    const id = Number(row.dataset.id);
    const toast = row.querySelector('.toast');
    const setToast = (msg, isErr) => { toast.textContent = msg; toast.style.color = isErr ? 'var(--negative-text)' : 'var(--stone)'; };

    row.querySelector('.saveUnitsBtn').addEventListener('click', async () => {
      const v = parseFloat(row.querySelector('.unitsInput').value);
      if (!v || v <= 0) return setToast('올바른 값 입력', true);
      try {
        await apiCall('POST', { action: 'set_units', stock_item_id: id, units_per_container: v });
        setToast('저장됨');
        load();
      } catch (e) { setToast('실패: ' + e.message, true); }
    });

    row.querySelector('.countBtn').addEventListener('click', async () => {
      const input = row.querySelector('.countInput');
      const v = parseFloat(input.value);
      if (isNaN(v) || v < 0) return setToast('통 수 입력', true);
      try {
        await apiCall('POST', { action: 'event', stock_item_id: id, event_type: 'count', container_count: v });
        setToast('카운트됨');
        input.value = '';
        load();
      } catch (e) { setToast('실패: ' + e.message, true); }
    });

    row.querySelector('.productionBtn').addEventListener('click', async () => {
      const input = row.querySelector('.productionInput');
      const v = parseFloat(input.value);
      if (isNaN(v) || v <= 0) return setToast('통 수 입력', true);
      try {
        await apiCall('POST', { action: 'event', stock_item_id: id, event_type: 'production', container_count: v });
        setToast('추가됨');
        input.value = '';
        load();
      } catch (e) { setToast('실패: ' + e.message, true); }
    });
  });
}

function renderList(filter) {
  const content = document.getElementById('content');
  const items = filter
    ? allItems.filter((i) => i.name.toLowerCase().includes(filter.toLowerCase()))
    : allItems;
  if (items.length === 0) {
    content.innerHTML = '<div class="error">검색 결과가 없습니다</div>';
    return;
  }
  content.innerHTML =
    '<div class="tableWrap"><table class="stock"><thead><tr>' +
      '<th class="nameCell">품목</th><th>상태</th><th>추정</th><th>일수</th><th>통당개수</th><th>카운트</th><th>생산</th><th></th>' +
    '</tr></thead><tbody>' +
    items.map(renderRow).join('') +
    '</tbody></table></div>';
  attachHandlers(content);
}

async function load() {
  const content = document.getElementById('content');
  try {
    const data = await apiCall('GET');
    allItems = data.items || [];
    content.className = '';
    renderList(document.getElementById('search').value);
  } catch (e) {
    if (e.message === 'UNAUTHORIZED') {
      localStorage.removeItem('stock_passcode');
      document.getElementById('app').hidden = true;
      document.getElementById('gate').hidden = false;
      document.getElementById('gateError').textContent = '비밀번호가 틀렸습니다';
      return;
    }
    content.className = 'error';
    content.textContent = '불러오지 못했습니다: ' + e.message;
  }
}

document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));

async function tryEnter(code) {
  passcode = code;
  document.getElementById('gateError').textContent = '';
  try {
    await apiCall('GET');
    localStorage.setItem('stock_passcode', code);
    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;
    load();
  } catch (e) {
    document.getElementById('gateError').textContent = '비밀번호가 틀렸습니다';
  }
}

document.getElementById('gateSubmit').addEventListener('click', () => {
  tryEnter(document.getElementById('passcodeInput').value);
});
document.getElementById('passcodeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') tryEnter(document.getElementById('passcodeInput').value);
});

const saved = localStorage.getItem('stock_passcode');
if (saved) tryEnter(saved);
</script>
</body>
</html>
