<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Golden Tree — 매출 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #17161f;
    --canvas: #ffffff;
    --surface-soft: #f7f7f5;
    --hairline: #e6e6e6;
    --hairline-soft: #f1f1f1;
    --stone: #6b6b6b;
    --muted: #9a9a9a;
    --positive-bg: #dceeb1;
    --positive-text: #1a6b34;
    --negative-bg: #f3c9b6;
    --negative-text: #a13d24;
    --today-fill: #17161f;
    --accent: #c5b0f4;
    --radius-card: 24px;
    --radius-md: 12px;
    --radius-pill: 50px;
    --shadow-card: 0 1px 2px -1px rgba(0,0,0,.08), 0 4px 16px -4px rgba(0,0,0,.06);
    --shadow-pop: 0 2px 4px -2px rgba(0,0,0,.1), 0 8px 24px -8px rgba(0,0,0,.1);
    --chart-colors: #dceeb1, #c5b0f4, #f4ecd6, #c8e6cd, #efd4d4, #f3c9b6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-soft);
    color: var(--ink);
    font-family: Inter, "SF Pro Display", system-ui, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: color-mix(in srgb, var(--canvas) 82%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--hairline-soft);
    padding: 16px 20px;
  }
  .brand {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .brand .dim { color: var(--muted); font-weight: 500; }
  main {
    padding: 20px 16px;
    max-width: 1080px;
    margin: 0 auto;
  }
  .loading, .error {
    text-align: center;
    color: var(--stone);
    padding: 60px 16px;
    font-size: 14px;
  }
  .error { color: var(--negative-text); }
  .card {
    background: var(--canvas);
    border: 1px solid var(--hairline-soft);
    box-shadow: var(--shadow-card);
    border-radius: var(--radius-card);
    padding: 26px;
  }
  .loc-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--stone);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .net-sales-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .net-sales { font-size: clamp(28px, 4vw, 36px); font-weight: 700; letter-spacing: -0.03em; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 11px;
    border-radius: var(--radius-pill);
  }
  .badge.up { background: var(--positive-bg); color: var(--positive-text); }
  .badge.down { background: var(--negative-bg); color: var(--negative-text); }
  .badge.flat { background: var(--hairline-soft); color: var(--stone); }
  .sub-label { font-size: 12.5px; color: var(--stone); margin-top: 5px; }
  .stat-row { display: flex; gap: 10px; margin-top: 20px; }
  .stat { flex: 1; background: var(--surface-soft); border-radius: var(--radius-md); padding: 12px 14px; }
  .stat .label { font-size: 10px; color: var(--stone); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .stat .value { font-size: 18px; font-weight: 700; margin-top: 3px; letter-spacing: -0.01em; }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--stone);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 22px 0 10px;
  }

  .daily-table { display: flex; flex-direction: column; gap: 1px; background: var(--hairline-soft); border-radius: var(--radius-md); overflow: hidden; }
  .daily-row { display: flex; align-items: center; gap: 8px; background: var(--canvas); padding: 9px 12px; }
  .daily-row .day { width: 48px; font-size: 12px; color: var(--stone); flex-shrink: 0; }
  .daily-row .bar-track { flex: 1; height: 8px; background: var(--surface-soft); border-radius: 4px; overflow: hidden; }
  .daily-row .bar-fill { height: 100%; background: var(--positive-bg); border-radius: 4px; }
  .daily-row.today .bar-fill { background: var(--today-fill); }
  .daily-row .amt { width: 88px; text-align: right; font-size: 12px; font-weight: 600; flex-shrink: 0; }

  .top-items { display: flex; flex-direction: column; gap: 8px; }
  .top-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .top-item .rank {
    width: 20px; height: 20px; border-radius: var(--radius-pill);
    background: var(--ink); color: var(--canvas); font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .top-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-item .variation { color: var(--stone); font-size: 11px; }
  .top-item .amt { font-weight: 600; flex-shrink: 0; }

  .pie-row { display: flex; align-items: center; gap: 18px; margin-top: 4px; }
  .pie { width: 92px; height: 92px; border-radius: 50%; flex-shrink: 0; box-shadow: var(--shadow-card); }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .legend-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { flex: 1; color: var(--stone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-pct { font-weight: 600; }

  footer { text-align: center; font-size: 11px; color: var(--muted); padding: 20px 16px 8px; letter-spacing: 0.01em; }

  /* ── 레이아웃: 왼쪽 시장 수요 예상(주력) / 오른쪽 매출 위젯(보조) ── */
  .layout { display: flex; flex-direction: column; gap: 16px; }
  .demand-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .sales-col { min-width: 0; }
  @media (min-width: 900px) {
    .layout { display: grid; grid-template-columns: 1fr 340px; align-items: start; gap: 20px; }
  }

  .disclaimer {
    font-size: 11.5px; color: var(--stone); background: var(--surface-soft);
    border-radius: var(--radius-md);
    padding: 10px 14px; line-height: 1.55;
  }

  /* ── 시장 수요 카드 ── */
  .demand-card { display: flex; flex-direction: column; gap: 4px; }
  .demand-score-row { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .demand-score { font-size: clamp(34px, 5vw, 44px); font-weight: 700; letter-spacing: -0.04em; }
  .demand-score .of100 { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: normal; }
  .demand-band {
    display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600;
    padding: 4px 11px; border-radius: var(--radius-pill);
  }
  .demand-band.quiet { background: var(--hairline-soft); color: var(--stone); }
  .demand-band.normal { background: var(--surface-soft); color: var(--ink); }
  .demand-band.busy { background: var(--positive-bg); color: var(--positive-text); }
  .demand-band.very_busy { background: var(--negative-bg); color: var(--negative-text); }
  .demand-delta { font-size: 12px; color: var(--stone); }

  .period-row { display: flex; gap: 8px; margin-top: 18px; }
  .period-stat {
    flex: 1; background: var(--surface-soft); border-radius: var(--radius-md);
    padding: 10px 8px; text-align: center;
  }
  .period-stat.current { background: var(--ink); }
  .period-stat.current .p-label,
  .period-stat.current .p-score { color: var(--canvas); }
  .period-stat .p-label { font-size: 9.5px; color: var(--stone); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .period-stat .p-score { font-size: 17px; font-weight: 700; margin-top: 3px; letter-spacing: -0.02em; }

  .reason-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
  .reason-item { display: flex; gap: 7px; font-size: 12.5px; align-items: flex-start; }
  .reason-item .sign { flex-shrink: 0; font-weight: 700; width: 12px; }
  .reason-item.pos .sign { color: var(--positive-text); }
  .reason-item.neg .sign { color: var(--negative-text); }
  .reason-item .text { color: var(--stone); }

  .demand-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--hairline-soft); }

  /* ── 매출 위젯(오른쪽, 축약형) ── */
  .widget-card { padding: 20px; }
  .widget-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .widget-header button {
    border: none; background: var(--surface-soft); color: var(--ink);
    width: 30px; height: 30px; border-radius: var(--radius-pill); font-size: 14px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .widget-header button:disabled { color: var(--muted); }
  .widget-header .week-label { text-align: center; flex: 1; }
  .widget-header .range { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
  .widget-header .tag { font-size: 9.5px; color: var(--stone); text-transform: uppercase; letter-spacing: 0.04em; }
  .sales-col .section-title { font-size: 10px; }
  .sales-col .net-sales { font-size: 24px; }
  .sales-col .card + .card { margin-top: 12px; }

  @media (min-width: 640px) and (max-width: 899px) {
    .demand-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">82 Bakeshop <span class="dim">· Golden Tree</span></div>
</header>
<main>
  <div id="content" class="loading">불러오는 중...</div>
</main>
<footer>매출 = NET SALES(총매출−할인), 세금·팁 제외 · 데이터는 자동 갱신됩니다</footer>

<script>
const API = 'https://stfiazhmznssyfsiaxvw.supabase.co/functions/v1/dashboard-api';
const CHART_COLORS = ['#dceeb1','#c5b0f4','#f4ecd6','#c8e6cd','#efd4d4','#f3c9b6'];
let weekOffset = 0;
let loading = false;

function fmtMoney(n) {
  return '$' + Number(n).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtDateRange(start, end) {
  const s = new Date(start + 'T00:00:00');
  const e = new Date(end + 'T00:00:00');
  const opt = { month: 'short', day: 'numeric' };
  return s.toLocaleDateString('en-CA', opt) + ' – ' + e.toLocaleDateString('en-CA', opt);
}
function dayLabel(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const dow = ['일','월','화','수','목','금','토'][d.getDay()];
  const md = d.toLocaleDateString('en-CA', { month: 'numeric', day: 'numeric' });
  return dow + ' ' + md;
}
function badgeHtml(pct) {
  if (pct === null || pct === undefined) return '<span class="badge flat">신규</span>';
  const dir = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
  const arrow = pct > 0 ? '▲' : pct < 0 ? '▼' : '–';
  return '<span class="badge ' + dir + '">' + arrow + ' ' + Math.abs(pct) + '%</span>';
}
function renderDaily(daily) {
  if (!daily || daily.length === 0) return '';
  const max = Math.max(...daily.map(d => d.net_sales), 1);
  const todayStr = new Date().toISOString().slice(0, 10);
  const rows = daily.map(d => {
    const w = Math.max(2, Math.round((d.net_sales / max) * 100));
    const isToday = d.business_date === todayStr;
    return '<div class="daily-row' + (isToday ? ' today' : '') + '">' +
      '<div class="day">' + dayLabel(d.business_date) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>' +
      '<div class="amt">' + fmtMoney(d.net_sales) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="section-title">일별 순매출</div><div class="daily-table">' + rows + '</div>';
}
function renderTopItems(items) {
  if (!items || items.length === 0) return '';
  const rows = items.map((it, i) => {
    const variation = it.variation_name ? '<span class="variation">' + it.variation_name + '</span>' : '';
    return '<div class="top-item">' +
      '<div class="rank">' + (i+1) + '</div>' +
      '<div class="name">' + it.item_name + ' ' + variation + '</div>' +
      '<div class="amt">' + fmtMoney(it.net_sales) + '</div>' +
    '</div>';
  }).join('');
  return '<div class="section-title">탑 세일 TOP 5</div><div class="top-items">' + rows + '</div>';
}
function renderCategoryPie(groups) {
  if (!groups || groups.length === 0) return '';
  let acc = 0;
  const stops = groups.map((g, i) => {
    const color = CHART_COLORS[i % CHART_COLORS.length];
    const start = acc;
    acc += g.pct;
    return color + ' ' + start + '% ' + acc + '%';
  }).join(', ');
  const pieStyle = 'background: conic-gradient(' + stops + ');';
  const legend = groups.map((g, i) => {
    const color = CHART_COLORS[i % CHART_COLORS.length];
    return '<div class="legend-item">' +
      '<div class="legend-dot" style="background:' + color + '"></div>' +
      '<div class="legend-name">' + g.name + '</div>' +
      '<div class="legend-pct">' + g.pct + '%</div>' +
    '</div>';
  }).join('');
  return '<div class="section-title">카테고리 비중</div><div class="pie-row">' +
    '<div class="pie" style="' + pieStyle + '"></div>' +
    '<div class="legend">' + legend + '</div>' +
  '</div>';
}
function renderLocation(loc) {
  return '<div class="card">' +
    '<div class="loc-name">' + loc.location_name + '</div>' +
    '<div class="net-sales-row">' +
      '<div class="net-sales">' + fmtMoney(loc.net_sales) + '</div>' +
      badgeHtml(loc.compare.net_sales_change_pct) +
    '</div>' +
    '<div class="sub-label">지난주 같은 기간 ' + fmtMoney(loc.compare.net_sales) + '</div>' +
    '<div class="stat-row">' +
      '<div class="stat"><div class="label">결제건수</div><div class="value">' + loc.order_count.toLocaleString() + '건</div></div>' +
      '<div class="stat"><div class="label">평균단가</div><div class="value">' + fmtMoney(loc.average_order_value) + '</div></div>' +
    '</div>' +
    renderDaily(loc.daily) +
    renderTopItems(loc.top_items) +
    renderCategoryPie(loc.category_groups) +
  '</div>';
}

const PERIOD_LABEL = { morning: '오전', afternoon: '오후', evening: '저녁' };
const BAND_LABEL = { quiet: '한산할 것으로 예상', normal: '평소 수준으로 예상', busy: '바쁠 것으로 예상', very_busy: '매우 바쁠 것으로 예상' };
const CONFIDENCE_LABEL = { low: '낮음', medium: '보통', high: '높음' };

function currentReginaPeriod() {
  const hour = Number(new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Regina', hour: '2-digit', hour12: false }).format(new Date()));
  if (hour >= 6 && hour < 11) return 'morning';
  if (hour >= 11 && hour < 17) return 'afternoon';
  return 'evening';
}
function fmtReginaTime(iso) {
  return new Date(iso).toLocaleTimeString('ko-KR', { timeZone: 'America/Regina', hour: 'numeric', minute: '2-digit' });
}
function deltaLabel(delta) {
  if (delta === null || delta === undefined) return '';
  if (delta === 0) return '<span class="demand-delta">어제와 동일</span>';
  const sign = delta > 0 ? '+' : '';
  return '<span class="demand-delta">어제 대비 ' + sign + delta + 'pt</span>';
}
function renderMarketDemand(loc) {
  const md = loc.market_demand;
  if (!md || !md.periods || md.periods.length === 0) {
    return '<div class="card demand-card"><div class="loc-name">' + loc.location_name + '</div>' +
      '<div class="sub-label" style="margin-top:12px;">아직 수집된 예상치가 없습니다</div></div>';
  }
  const nowPeriod = currentReginaPeriod();
  const cur = md.periods.find(p => p.period === nowPeriod) || md.periods[0];
  const periods = md.periods.map(p => {
    return '<div class="period-stat' + (p.period === cur.period ? ' current' : '') + '">' +
      '<div class="p-label">' + PERIOD_LABEL[p.period] + '</div>' +
      '<div class="p-score">' + p.score + '</div>' +
    '</div>';
  }).join('');
  const reasonList = typeof cur.reasons === 'string' ? JSON.parse(cur.reasons) : (cur.reasons || []);
  const reasons = reasonList.map(r => {
    const isPos = r.sign === '+';
    return '<div class="reason-item ' + (isPos ? 'pos' : 'neg') + '">' +
      '<div class="sign">' + (isPos ? '+' : '−') + '</div>' +
      '<div class="text">' + r.text + '</div>' +
    '</div>';
  }).join('');
  return '<div class="card demand-card">' +
    '<div class="loc-name">' + loc.location_name + '</div>' +
    '<div class="demand-score-row">' +
      '<div class="demand-score">' + cur.score + '<span class="of100">/100</span></div>' +
      '<div class="demand-band ' + cur.demand_band + '">' + BAND_LABEL[cur.demand_band] + '</div>' +
    '</div>' +
    deltaLabel(cur.vs_yesterday) +
    '<div class="period-row">' + periods + '</div>' +
    (reasons ? '<div class="section-title">주요 원인</div><div class="reason-list">' + reasons + '</div>' : '') +
    '<div class="demand-meta">' +
      '<span>신뢰도 ' + CONFIDENCE_LABEL[cur.confidence] + '</span>' +
      '<span>갱신 ' + fmtReginaTime(cur.calculated_at) + '</span>' +
    '</div>' +
  '</div>';
}

async function load() {
  if (loading) return;
  loading = true;
  const content = document.getElementById('content');
  content.className = 'loading';
  content.textContent = '불러오는 중...';
  try {
    const res = await fetch(API + '?week_offset=' + weekOffset);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const demandHtml =
      '<div class="section-title" style="margin-top:0;">Regina 시장 수요 예상</div>' +
      '<div class="disclaimer">실제 방문객 수가 아닌 시장 신호(과거 실적·날씨·요일·캘린더) 기반 예상입니다. 확정된 혼잡도가 아닙니다.</div>' +
      data.locations.map(renderMarketDemand).join('');

    const salesHtml =
      '<div class="card widget-card">' +
        '<div class="widget-header">' +
          '<button id="prevWeek" aria-label="이전 주">&#8249;</button>' +
          '<div class="week-label">' +
            '<div class="range" id="weekRange">' + fmtDateRange(data.week_start, data.week_end) + '</div>' +
            '<div class="tag" id="weekTag">' + (data.is_current_week ? '이번 주 (진행 중)' : '') + '</div>' +
          '</div>' +
          '<button id="nextWeek" aria-label="다음 주">&#8250;</button>' +
        '</div>' +
      '</div>' +
      data.locations.map(renderLocation).join('');

    content.className = 'layout';
    content.innerHTML =
      '<div class="demand-col">' + demandHtml + '</div>' +
      '<div class="sales-col">' + salesHtml + '</div>';

    document.getElementById('prevWeek').addEventListener('click', () => { weekOffset -= 1; load(); });
    document.getElementById('nextWeek').addEventListener('click', () => { if (weekOffset < 0) { weekOffset += 1; load(); } });
    document.getElementById('nextWeek').disabled = weekOffset >= 0;
  } catch (err) {
    content.className = 'error';
    content.textContent = '불러오지 못했습니다: ' + err.message;
  } finally {
    loading = false;
  }
}

load();
</script>
</body>
</html>
